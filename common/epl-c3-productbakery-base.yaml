esphome:
  name: ${name}
  comment: EPL C3 ProductBakery
  friendly_name: ${friendly_name}
  name_add_mac_suffix: True
  project:
    name: ProductBakery.EPL-C3
    version: "1.0.0"
  on_boot:
    priority: -100
    then:
      - lambda: |-
          if (std::string("${ device_config.bluetooth_enabled | lower }") == "true") {
            id(firmware_ble).publish_state("Enabled");
          } else {
            id(firmware_ble).publish_state("Disabled");
          }

          if (std::string("${ device_config.co2_enabled | lower }") == "true") {
            id(firmware_co2).publish_state("Enabled");
          } else {
            id(firmware_co2).publish_state("Disabled");
          }

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf

# Enable logging
logger:
  level: ${log_level}
  hardware_uart: USB_SERIAL_JTAG

# Enable Home Assistant API
api:
  actions:
    - action: get_build_flags
      then:
        - api.respond:
            data: !lambda |-
              root["co2_enabled"]       = ${ device_config.co2_enabled | lower };
              root["bluetooth_enabled"] = ${ device_config.bluetooth_enabled | lower };
              root["board_revision"]    = "${ device_config.board_revision }";
              root["sensor_variant"]    = "${ device_config.sensor_variant }";
              root["firmware_channel"]  = "${ device_config.firmware_channel }";
              root["model"]             = "${ device_config.model }";

ota:
  - platform: esphome
    id: ota_esphome

wifi:

improv_serial:

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: true

light:
  - platform: neopixelbus
    type: GRB
    variant: WS2812
    pin: GPIO10
    num_leds: 3
    name: "LED Strip"
    id: led_strip
    restore_mode: ALWAYS_OFF
    internal: true
  - platform: partition
    name: "Status LED"
    id: led_status
    restore_mode: ALWAYS_OFF
    entity_category: config
    segments:
      - id: led_strip
        from: 0
        to: 0
  - platform: partition
    name: "Zone 1 LED"
    id: led_zone1
    restore_mode: ALWAYS_OFF
    entity_category: config
    segments:
      - id: led_strip
        from: 1
        to: 1
  - platform: partition
    name: "Zone 2 LED"
    id: led_zone2
    restore_mode: ALWAYS_OFF
    entity_category: config
    segments:
      - id: led_strip
        from: 2
        to: 2

globals:
  - id: led_status_saved_state
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: led_status_saved_r
    type: float
    restore_value: false
    initial_value: '0'
  - id: led_status_saved_g
    type: float
    restore_value: false
    initial_value: '0'
  - id: led_status_saved_b
    type: float
    restore_value: false
    initial_value: '0'
  - id: led_status_saved_brightness
    type: float
    restore_value: false
    initial_value: '0'
  - id: led_zone1_saved_state
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: led_zone1_saved_r
    type: float
    restore_value: false
    initial_value: '0'
  - id: led_zone1_saved_g
    type: float
    restore_value: false
    initial_value: '0'
  - id: led_zone1_saved_b
    type: float
    restore_value: false
    initial_value: '0'
  - id: led_zone1_saved_brightness
    type: float
    restore_value: false
    initial_value: '0'
  - id: led_zone2_saved_state
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: led_zone2_saved_r
    type: float
    restore_value: false
    initial_value: '0'
  - id: led_zone2_saved_g
    type: float
    restore_value: false
    initial_value: '0'
  - id: led_zone2_saved_b
    type: float
    restore_value: false
    initial_value: '0'
  - id: led_zone2_saved_brightness
    type: float
    restore_value: false
    initial_value: '0'

number:
  - platform: template
    name: "Illuminance Offset"
    id: illuminance_offset_ui
    unit_of_measurement: "lx"
    min_value: -100
    max_value: 100
    step: 5
    mode: slider
    update_interval: never
    optimistic: true
    restore_value: true
    initial_value: 0
    icon: "mdi:brightness-5"
    entity_category: config
    on_value:
      - script.execute: measure_illuminance

sensor:
  - platform: bh1750
    name: Illuminance
    id: illuminance_sensor
    i2c_id: bus_a
    address: 0x23
    update_interval: never
    accuracy_decimals: 0
    filters:
      - lambda: "return x + id(illuminance_offset_ui).state;"
      - or:
        - delta: 5%
        - delta: 5
      - clamp:
          min_value: 0

interval:
  - interval: ${illuminance_update_interval}
    then:
      - script.execute: measure_illuminance

script:
  - id: measure_illuminance
    mode: single
    then:
      # Save current LED states
      - lambda: |-
          auto sv = id(led_status).current_values;
          id(led_status_saved_state) = sv.is_on();
          id(led_status_saved_r) = sv.get_red();
          id(led_status_saved_g) = sv.get_green();
          id(led_status_saved_b) = sv.get_blue();
          id(led_status_saved_brightness) = sv.get_brightness();
          auto z1 = id(led_zone1).current_values;
          id(led_zone1_saved_state) = z1.is_on();
          id(led_zone1_saved_r) = z1.get_red();
          id(led_zone1_saved_g) = z1.get_green();
          id(led_zone1_saved_b) = z1.get_blue();
          id(led_zone1_saved_brightness) = z1.get_brightness();
          auto z2 = id(led_zone2).current_values;
          id(led_zone2_saved_state) = z2.is_on();
          id(led_zone2_saved_r) = z2.get_red();
          id(led_zone2_saved_g) = z2.get_green();
          id(led_zone2_saved_b) = z2.get_blue();
          id(led_zone2_saved_brightness) = z2.get_brightness();
      # Turn off all LEDs
      - light.turn_off: led_status
      - light.turn_off: led_zone1
      - light.turn_off: led_zone2
      # Wait for LEDs to fully quench before sampling
      - delay: 50ms
      # Take measurement
      - component.update: illuminance_sensor
      # Restore LEDs to their previous state
      - lambda: |-
          if (id(led_status_saved_state)) {
            auto call = id(led_status).turn_on();
            call.set_rgb(id(led_status_saved_r), id(led_status_saved_g), id(led_status_saved_b));
            call.set_brightness(id(led_status_saved_brightness));
            call.perform();
          }
          if (id(led_zone1_saved_state)) {
            auto call = id(led_zone1).turn_on();
            call.set_rgb(id(led_zone1_saved_r), id(led_zone1_saved_g), id(led_zone1_saved_b));
            call.set_brightness(id(led_zone1_saved_brightness));
            call.perform();
          }
          if (id(led_zone2_saved_state)) {
            auto call = id(led_zone2).turn_on();
            call.set_rgb(id(led_zone2_saved_r), id(led_zone2_saved_g), id(led_zone2_saved_b));
            call.set_brightness(id(led_zone2_saved_brightness));
            call.perform();
          }

button:
  - platform: restart
    icon: mdi:power-cycle
    name: "ESP Reboot"
    entity_category: config
  - platform: factory_reset
    id: "factory_reset_button"
    internal: True

select:
  - platform: template
    id: firmware_ble
    name: Bluetooth Proxy
    icon: "mdi:bluetooth"
    entity_category: diagnostic
    optimistic: true
    restore_value: true
    options:
      - "Disabled"
      - "Enabled"
    initial_option: "Disabled"

  - platform: template
    id: firmware_co2
    name: CO2 Sensor
    icon: "mdi:molecule-co2"
    entity_category: diagnostic
    optimistic: true
    restore_value: true
    options:
      - "Disabled"
      - "Enabled"
    initial_option: "Disabled"
